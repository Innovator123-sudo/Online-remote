# Render.com Service Configuration
# This file configures your service on Render.com

services:
  # Main web service - serves the gesture control website and API
  - type: web
    name: tv-control-hub
    env: node
    region: oregon  # Choose region closest to your TVs for best latency
    plan: starter   # Free tier available
    
    # Build command - leave empty for Node.js
    buildCommand: "echo 'Build complete'"
    
    # Start command
    startCommand: "node server.js"
    
    # Health check endpoint (add /health to server.js for this)
    healthCheckPath: /status
    
    # Environment variables
    envVars:
      # Node environment
      - key: NODE_ENV
        value: production
      
      # Port (Render provides this automatically)
      - key: PORT
        fromService:
          name: tv-control-hub
          type: web
          property: PORT
      
      # TV Discovery Mode: 'ssdp', 'manual', 'mock'
      # Use 'manual' in cloud since SSDP doesn't work across networks
      - key: TV_DISCOVERY_MODE
        value: manual
      
      # TV Configuration (JSON array of TVs)
      # Replace with your actual TV IPs and names
      - key: TVS_CONFIG
        sync: false  # Set manually in Render dashboard for security
      
      # Enable mock TVs for testing (set to false in production)
      - key: ENABLE_MOCK_TVS
        value: "false"
      
      # API Key for authentication (optional but recommended)
      - key: API_KEY
        sync: false  # Generate a secure random key and set manually
      
      # CORS allowed origins
      - key: ALLOWED_ORIGINS
        sync: false  # Set your domain here

# Additional workers or services can be added here
# For a simple setup, the web service above is sufficient
