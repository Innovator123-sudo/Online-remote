[project]
description = "Android TV Remote - Cloud Relay Server for remote TV control from anywhere"

[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "node remote-cloud-server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/"
healthcheckTimeout = 100
startTimeout = 360

[env]
PORT = "5000"
NODE_ENV = "production"