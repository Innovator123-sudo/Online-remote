version: '3.8'

services:
  # Cloud Relay Server - Deploy to Railway/Render/VPS
  cloud-server:
    build: .
    container_name: tv-remote-cloud
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    restart: unless-stopped
    command: node remote-cloud-server.js

  # Local Bridge Agent - Run on home network
  bridge-agent:
    build: .
    container_name: tv-remote-bridge
    network_mode: host
    environment:
      - CLOUD_SERVER_URL=wss://your-cloud-server.com:5000
      - BRIDGE_MODE=home
    restart: unless-stopped
    command: node remote-bridge.js
